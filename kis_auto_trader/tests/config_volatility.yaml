# 자동매매 설정 파일. 코드를 건드리지 않고 이 파일 숫자만 바꾸면 됩니다.

account:
  # mock: 모의투자 (가짜 돈, 안전) / real: 실전투자 (진짜 돈, 주의)
  # 검증 없이 real 로 바로 진행하기로 한 상태입니다. 최초 실행 시 main.py 가
  # "REAL" 입력을 요구합니다.
  mode: real

  # 총 투자금 (원, 참고용). 2026-08-19부터 실현손익도 전액 재투자하기로 하면서
  # 이 값은 더 이상 실제 매수 예산 상한이 아닙니다 - 실제 예산은 그때그때
  # 계좌 현금 전체를 빈 슬롯 수로 나눈 값입니다 (risk.calc_buy_quantity 참고).
  total_capital: 2000000

  # 총 투자금 중 현금으로 남겨둘 비율 (수수료/슬리피지 여유분)
  # 0으로 설정 - 아래 watchlist invest_ratio 합이 정확히 100%라 현금 버퍼 없이 전액 투자
  cash_buffer_ratio: 0.0

strategy:
  # 매수(진입) 판단 방식을 고릅니다.
  #   ma_cross : 이동평균 골든크로스(단기선이 장기선을 상향 돌파) 매수 / 데드크로스(하향 돌파) 매도
  #   dip_buy  : 최근 며칠 고점 대비 일정 비율 이상 떨어지면 매수 (매도는 안 하고,
  #              아래 risk 의 익절/손절에게 전부 맡김)
  #   news_buy : 가격 조건 없이, 감시목록에 있으면 바로 매수 (매도는 dip_buy 처럼 익절/손절에 맡김)
  #              screener.py --mode news 로 종목을 고를 때 자동으로 이 값으로 바뀝니다 -
  #              뉴스가 호재라서 고른 건데 또 하락폭 조건을 걸면 안 사질 수 있어서입니다.
  entry_mode: dip_buy

  # (2026-08-21 신규) 후보 종목을 어떤 기준으로 뽑을지.
  #   dip        : 고점 대비 하락폭이 큰 순 (기존 방식)
  #   volatility : 오늘 일중 변동폭(고가-저가)이 큰 순 - 변동성 큰 종목 위주로
  #                더 활발하게 소액 회전매매하고 싶어서 추가함
  candidate_selection: volatility

  # entry_mode: ma_cross 일 때만 쓰이는 값
  short_ma: 5
  long_ma: 20

  # entry_mode: dip_buy 일 때만 쓰이는 값
  # 최근 dip_lookback_days 일의 고가 중 최댓값 대비 이 비율(%, 음수) 이상 떨어지면 매수
  # (2026-08-21) -10.0 -> -3.0, 20일 -> 5일: 변동성 큰 종목은 하루 안에도 몇 % 씩
  # 출렁이므로, 예전처럼 20일 고점 대비 깊은 하락을 기다리면 신호가 거의 안 뜬다.
  dip_buy_pct: -3.0
  dip_lookback_days: 5

  # 하락폭 조건을 만족해도, 최근 reversal_window_days 일의 저가 대비 이 비율(%)
  # 이상 이미 올라와 있어야 매수한다 - "떨어지기만 하고 아직 안 돌아선" 종목까지
  # 사버리는 걸 막기 위함. (2026-08-21) 3.0 -> 1.0, 3일 -> 2일: "약간이라도
  # 오르면" 바로 반응하도록 기준을 낮춤.
  rebound_confirm_pct: 1.0
  reversal_window_days: 2

  # (2026-08-20) 눌림목+반등 조건을 만족해도, 지금까지의 누적거래량이 최근
  # volume_avg_days 일 평균 거래량을 "지금 이 시각까지 장이 진행된 비율"로
  # 환산한 예상치의 volume_multiplier 배 이상이어야 매수한다 - 매수세 없이
  # 가격만 잠깐 튄 가짜 반등을 거르기 위함. 0이면 이 확인 없이 예전처럼
  # 가격 조건만 본다. (변동성 모드에서도 안전장치로 그대로 유지)
  volume_multiplier: 2.0
  volume_avg_days: 5

risk:
  # 매수 후 이 비율(%)만큼 손실이 나면 전략 신호와 무관하게 즉시 매도
  # (2026-08-21) -4.0 -> -1.5: 익절 목표를 작게 잡은(1.2%) 만큼, 손절도 같이
  # 좁혀야 손익비가 안 무너진다.
  stop_loss_pct: -1.5
  # (2026-08-21) 16000 -> 4000: 슬롯 크기가 작아진(200만원/5) 만큼 금액 기준도 축소
  stop_loss_amount: 4000

  # 매수 후 이 비율(%)만큼 "수수료·세금을 뺀 순이익"이 나면 즉시 매도 (0이면 익절 기능 끔)
  # 아래 fees 에 적어둔 수수료/세금을 실제로 빼고 계산하므로, 겉보기 상승률이 아니라
  # 진짜 순이익 기준입니다. watchlist 의 모든 종목에 동일하게 적용됩니다.
  # (2026-08-21) 3.5 -> 1.2: 변동성 큰 종목에서 작게 자주 먹고 빠지는 방식으로 전환
  take_profit_pct: 1.2

  # 종목당 순이익이 이 금액(원) 이상이면 위 %기준과 무관하게 즉시 매도.
  # 둘 중 먼저 도달하는 쪽에서 익절합니다. 0이면 금액 기준 꺼짐(% 기준만 적용).
  # (2026-08-21) 16000 -> 3000: 슬롯 크기+익절 목표가 작아진 만큼 축소
  take_profit_amount: 3000

  # 동시에 보유할 수 있는 최대 종목 수
  # (2026-08-21) 3 -> 5: 여러 종목을 조금씩 나눠서 더 활발하게 회전매매
  max_positions: 5

market_adaptive:
  # 코스피 지수를 보고 익절/손절 기준을 유동적으로 조정합니다.
  enabled: true
  index_code: "0001"      # 0001 = 코스피, 1001 = 코스닥
  trend_ma_days: 20       # 지수가 이 이동평균 위면 상승장, 아래면 하락장으로 판단

  # 추세가 하루 이어질 때마다 기준을 이만큼(%p)씩 옮깁니다.
  # 지속일수는 max_adjust_days 까지만 반영합니다 (하락장 50일째라고 무한정 조여지면 안 되므로).
  # (2026-08-21) 기준값(익절 1.2%/손절 -1.5%)이 예전(3.5%/-4.0%)의 약 1/3 수준으로
  # 작아진 만큼, 조정폭도 같이 1/3 수준으로 줄임 (안 줄이면 조정만으로 목표가
  # 원래보다 커져버려서 "작게 자주"라는 취지가 무너짐).
  max_adjust_days: 5
  bull_tp_per_day: 0.1    # 상승장: 익절선을 올려서 더 오래 들고 감
  bull_sl_per_day: -0.1   # 상승장: 손절선도 여유 있게
  bear_tp_per_day: -0.1   # 하락장: 익절선을 낮춰 빨리 확정
  bear_sl_per_day: 0.1    # 하락장: 손절선을 빡빡하게

  # true 로 두면 손절을 "내 종목이 몇 % 빠졌나"가 아니라
  # "코스피보다 몇 %p 더 나쁜가"로 판단합니다.
  # (시장이 통째로 무너지는 날 혼자만 손절당하는 걸 막습니다)
  use_relative_stop_loss: true

fees:
  # 매수 시 수수료 (%). 실제 이용 중인 증권사 수수료율로 바꿔주세요.
  buy_fee_pct: 0.015
  # 매도 시 수수료 (%)
  sell_fee_pct: 0.015
  # 매도 시 증권거래세 (%). 세율은 정책에 따라 바뀔 수 있으니 주기적으로 확인하세요.
  sell_tax_pct: 0.18

# 감시할 종목 목록. invest_ratio 는 이제 실제 매수 예산 계산에는 안 쓰이고(전액
# 재투자 방식으로 계좌 현금을 빈 슬롯 수로 균등 분배), evening_screen.py 가
# 매일 저녁 자동으로 이 블록을 통째로 교체합니다.
watchlist:
  - code: "328130"
    name: "루닛"
    invest_ratio: 0.3333
  - code: "477850"
    name: "마키나락스"
    invest_ratio: 0.3333
  - code: "950260"
    name: "인제니아테라퓨틱스(Reg.S)"
    invest_ratio: 0.3333
