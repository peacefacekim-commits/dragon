<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모의 강의 2</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <p class="eyebrow">시연용 모의 강의 (실제 사이트 아님)</p>
    <div class="dots">
      <div class="dot done"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
    <h1>2강. 신호를 감지하고 판단하기</h1>

    <div class="status-row">
      <span id="status" class="status-badge learning">학습중</span>
      <span id="timer" class="timer">01:00 남음</span>
    </div>

    <div class="progress-track">
      <div id="fill" class="progress-fill"></div>
    </div>

    <div class="next-area">
      <a id="next-btn" href="lecture3.html">다음 강의로 이동 →</a>
      <p id="hint" class="hint">자동화 도구가 이 버튼을 감지해서 클릭합니다</p>
    </div>

    <p class="footnote">완료까지 남은 시간이 다 되면, 위 상태 표시가 초록색으로 자동 전환됩니다.</p>
  </div>

  <script src="engine.js"></script>
</body>
</html>
