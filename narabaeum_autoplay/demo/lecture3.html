<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모의 강의 3</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <p class="eyebrow">시연용 모의 강의 (실제 사이트 아님)</p>
    <div class="dots">
      <div class="dot done"></div>
      <div class="dot done"></div>
      <div class="dot active"></div>
    </div>
    <h1>3강. 사람의 자리는 어디인가</h1>

    <div class="status-row">
      <span id="status" class="status-badge learning">학습중</span>
      <span id="timer" class="timer">01:00 남음</span>
    </div>

    <div class="progress-track">
      <div id="fill" class="progress-fill"></div>
    </div>

    <div id="normal-area" class="next-area">
      <p class="footnote">이번이 마지막 강의라, 완료되면 “다음 강의” 버튼 대신 완료 화면이 나옵니다.</p>
    </div>

    <div id="celebrate-area" class="celebrate" style="display:none">
      <div class="big">🎉</div>
      <h1>모든 강의를 이수했습니다</h1>
      <p>더 이상 열 강의가 없어서, 자동화 도구도 여기서 자연스럽게 멈춥니다.<br />
      "다음 강의" 버튼이 없으니 억지로 아무거나 누르지 않는 것도 이 도구의 설계입니다.</p>
    </div>
  </div>

  <script>
    const DURATION = 60;
    let remaining = DURATION;

    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");
    const fillEl = document.getElementById("fill");
    const normalArea = document.getElementById("normal-area");
    const celebrateArea = document.getElementById("celebrate-area");

    function fmt(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s} 남음`;
    }

    function tick() {
      const pct = Math.round(((DURATION - remaining) / DURATION) * 100);
      fillEl.style.width = pct + "%";
      timerEl.textContent = fmt(remaining);

      if (remaining <= 0) {
        clearInterval(intervalId);
        statusEl.textContent = "수강완료";
        statusEl.classList.remove("learning");
        statusEl.classList.add("done");
        fillEl.classList.add("done");
        timerEl.textContent = "완료";
        normalArea.style.display = "none";
        celebrateArea.style.display = "block";
        return;
      }
      remaining -= 1;
    }

    tick();
    const intervalId = setInterval(tick, 1000);
  </script>
</body>
</html>
